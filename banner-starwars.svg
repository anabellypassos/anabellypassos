<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Holograma: Anabelly Passos, Desenvolvedora Front-end e Full-Stack">
<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.holo{animation:flick 6s steps(1) infinite}
@keyframes flick{0%,100%{opacity:.95}7%{opacity:.6}8%{opacity:.95}41%{opacity:.9}42%{opacity:.45}43%{opacity:.95}77%{opacity:.85}78%{opacity:.55}79%{opacity:.95}}
.glitch{animation:gl 5s steps(1) infinite}
@keyframes gl{0%,100%{transform:translateX(0)}42%{transform:translateX(4px)}43%{transform:translateX(-3px)}44%{transform:translateX(0)}}
.float{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(600px,104px)}50%{transform:translate(600px,96px)}}
.scan{animation:sc 3.2s linear infinite}
@keyframes sc{0%{transform:translateY(40px);opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(330px);opacity:0}}
.pulse{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.55}50%{opacity:1}}
.blink{animation:bl 1.4s steps(1) infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
.eye{animation:ey 5s ease-in-out infinite;transform-origin:0px -12px}
@keyframes ey{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ring{animation:rg 12s linear infinite;transform-origin:600px 398px}
@keyframes rg{to{transform:rotate(360deg)}}
.hud{font-family:'Courier New',Consolas,monospace;fill:#FFE81F;letter-spacing:2px}
</style>
